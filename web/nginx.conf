server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }
    location /web/ {
        alias /usr/share/nginx/html/;
    }

    # The dashboard talks to the host's systemd-managed JIT API through
    # the Docker host gateway. The API token stays in the browser session.
    location = /health {
        proxy_pass http://host.docker.internal:5055;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location = /rules {
        proxy_pass http://host.docker.internal:5055;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location ^~ /rules/ {
        proxy_pass http://host.docker.internal:5055;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location / {
        return 404;
    }
}
